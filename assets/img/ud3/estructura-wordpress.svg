<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Arial, sans-serif">
  <title>Estructura de archivos y de base de datos de WordPress</title>
  <rect width="960" height="470" fill="#fff"/>
  <text x="240" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2a5542">Archivos (/var/www/wordpress)</text>
  <text x="720" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#21759b">Base de datos (MySQL)</text>
  <rect x="20" y="50" width="440" height="405" rx="10" fill="#f6faf7" stroke="#2a5542" stroke-width="2"/>
  <g font-size="14" fill="#222">
    <g transform="translate(40,80)"><rect width="18" height="14" rx="2" fill="#e0b84a"/><text x="28" y="12" font-weight="bold">wordpress/</text></g>
    <line x1="49" y1="96" x2="49" y2="384" stroke="#999" stroke-width="1.5"/>
    <g transform="translate(65,115)"><line x1="-16" y1="7" x2="0" y2="7" stroke="#999" stroke-width="1.5"/><rect width="18" height="14" rx="2" fill="#e0b84a"/><text x="28" y="12" font-weight="bold">wp-admin/</text><text x="135" y="12" fill="#666" font-size="12">panel de administración (núcleo)</text></g>
    <g transform="translate(65,145)"><line x1="-16" y1="7" x2="0" y2="7" stroke="#999" stroke-width="1.5"/><rect width="18" height="14" rx="2" fill="#e0b84a"/><text x="28" y="12" font-weight="bold">wp-includes/</text><text x="135" y="12" fill="#666" font-size="12">librerías y funciones (núcleo)</text></g>
    <g transform="translate(65,175)"><line x1="-16" y1="7" x2="0" y2="7" stroke="#999" stroke-width="1.5"/><rect width="18" height="14" rx="2" fill="#2a5542"/><text x="28" y="12" font-weight="bold" fill="#2a5542">wp-content/</text><text x="135" y="12" fill="#2a5542" font-size="12">tu contenido: lo que hay que conservar</text></g>
    <line x1="74" y1="191" x2="74" y2="272" stroke="#2a5542" stroke-width="1.5"/>
    <g transform="translate(90,205)"><line x1="-16" y1="7" x2="0" y2="7" stroke="#2a5542" stroke-width="1.5"/><rect width="18" height="14" rx="2" fill="#7fb59a"/><text x="28" y="12">themes/</text><text x="120" y="12" fill="#666" font-size="12">temas (diseño)</text></g>
    <g transform="translate(90,235)"><line x1="-16" y1="7" x2="0" y2="7" stroke="#2a5542" stroke-width="1.5"/><rect width="18" height="14" rx="2" fill="#7fb59a"/><text x="28" y="12">plugins/</text><text x="120" y="12" fill="#666" font-size="12">complementos (funciones)</text></g>
    <g transform="translate(90,265)"><line x1="-16" y1="7" x2="0" y2="7" stroke="#2a5542" stroke-width="1.5"/><rect width="18" height="14" rx="2" fill="#7fb59a"/><text x="28" y="12">uploads/</text><text x="120" y="12" fill="#666" font-size="12">imágenes y archivos subidos</text></g>
    <g transform="translate(65,305)"><line x1="-16" y1="9" x2="0" y2="9" stroke="#999" stroke-width="1.5"/><rect width="14" height="18" rx="2" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="28" y="13" font-weight="bold" fill="#b3261e">wp-config.php</text><text x="150" y="13" fill="#666" font-size="12">conexión a la BD y claves secretas</text></g>
    <g transform="translate(65,340)"><line x1="-16" y1="9" x2="0" y2="9" stroke="#999" stroke-width="1.5"/><rect width="14" height="18" rx="2" fill="#fff" stroke="#666"/><text x="28" y="13">.htaccess</text><text x="150" y="13" fill="#666" font-size="12">enlaces permanentes (Apache)</text></g>
    <g transform="translate(65,375)"><line x1="-16" y1="9" x2="0" y2="9" stroke="#999" stroke-width="1.5"/><rect width="14" height="18" rx="2" fill="#fff" stroke="#666"/><text x="28" y="13">index.php, wp-login.php…</text></g>
    <text x="40" y="432" font-size="12" fill="#555">wp-admin y wp-includes se sustituyen en cada actualización: no se editan.</text>
  </g>
  <rect x="500" y="50" width="440" height="405" rx="10" fill="#f3f8fc" stroke="#21759b" stroke-width="2"/>
  <g font-size="13" fill="#222">
    <g transform="translate(520,70)"><rect width="195" height="58" rx="6" fill="#fff" stroke="#21759b"/><text x="10" y="22" font-weight="bold" fill="#21759b">wp_posts</text><text x="10" y="42" font-size="11" fill="#555">entradas, páginas, adjuntos</text></g>
    <g transform="translate(725,70)"><rect width="195" height="58" rx="6" fill="#fff" stroke="#21759b"/><text x="10" y="22" font-weight="bold" fill="#21759b">wp_postmeta</text><text x="10" y="42" font-size="11" fill="#555">datos extra de cada contenido</text></g>
    <g transform="translate(520,140)"><rect width="195" height="58" rx="6" fill="#fff" stroke="#21759b"/><text x="10" y="22" font-weight="bold" fill="#21759b">wp_users</text><text x="10" y="42" font-size="11" fill="#555">cuentas (contraseña cifrada)</text></g>
    <g transform="translate(725,140)"><rect width="195" height="58" rx="6" fill="#fff" stroke="#21759b"/><text x="10" y="22" font-weight="bold" fill="#21759b">wp_usermeta</text><text x="10" y="42" font-size="11" fill="#555">rol y preferencias del usuario</text></g>
    <g transform="translate(520,210)"><rect width="195" height="58" rx="6" fill="#fff" stroke="#21759b"/><text x="10" y="22" font-weight="bold" fill="#21759b">wp_terms, wp_term_*</text><text x="10" y="42" font-size="11" fill="#555">categorías y etiquetas</text></g>
    <g transform="translate(725,210)"><rect width="195" height="58" rx="6" fill="#fff" stroke="#21759b"/><text x="10" y="22" font-weight="bold" fill="#21759b">wp_comments</text><text x="10" y="42" font-size="11" fill="#555">comentarios y su moderación</text></g>
    <g transform="translate(520,280)"><rect width="400" height="58" rx="6" fill="#fff" stroke="#21759b" stroke-width="2"/><text x="10" y="22" font-weight="bold" fill="#21759b">wp_options</text><text x="10" y="42" font-size="11" fill="#555">ajustes del sitio: URL, título, tema activo, plugins activos, roles…</text></g>
    <text x="520" y="372" font-size="12" fill="#555">El prefijo wp_ se define en wp-config.php ($table_prefix).</text>
    <text x="520" y="395" font-size="12" fill="#555">Una copia de seguridad completa necesita SIEMPRE</text>
    <text x="520" y="414" font-size="12" font-weight="bold" fill="#b3261e">la base de datos + la carpeta wp-content.</text>
  </g>
</svg>
