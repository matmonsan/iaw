<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Arial, sans-serif">
  <title>Partes del editor de bloques de WordPress</title>
  <rect width="960" height="470" fill="#fff"/>
  <rect x="10" y="10" width="940" height="420" rx="8" fill="#fff" stroke="#c3c4c7" stroke-width="2"/>
  <rect x="10" y="10" width="940" height="50" rx="8" fill="#fff" stroke="#c3c4c7"/>
  <rect x="22" y="20" width="30" height="30" fill="#1d2327"/>
  <text x="37" y="41" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">W</text>
  <rect x="62" y="20" width="30" height="30" rx="3" fill="#2271b1"/>
  <text x="77" y="42" text-anchor="middle" font-size="22" fill="#fff">+</text>
  <text x="105" y="41" font-size="16" fill="#1d2327">↶  ↷  ☰</text>
  <text x="480" y="41" text-anchor="middle" font-size="13" fill="#50575e">Bienvenida al curso · Entrada</text>
  <text x="730" y="41" font-size="13" fill="#2271b1">Guardar borrador</text>
  <rect x="840" y="21" width="72" height="28" rx="3" fill="#2271b1"/>
  <text x="876" y="40" text-anchor="middle" font-size="13" fill="#fff">Publicar</text>
  <rect x="918" y="21" width="24" height="28" rx="3" fill="#1d2327"/>
  <rect x="923" y="27" width="6" height="16" fill="#fff"/>
  <text x="300" y="100" font-size="30" font-weight="bold" fill="#1d2327">Bienvenida al curso</text>
  <rect x="140" y="125" width="470" height="44" rx="2" fill="none" stroke="#2271b1" stroke-width="2"/>
  <rect x="140" y="93" width="190" height="28" rx="2" fill="#fff" stroke="#1d2327"/>
  <text x="150" y="112" font-size="12" fill="#1d2327">¶  ⋮⋮  ⌃⌄   B  I  🔗  ⋯</text>
  <text x="150" y="146" font-size="14" fill="#1d2327">Este bloque de párrafo está seleccionado: su barra</text>
  <text x="150" y="163" font-size="14" fill="#1d2327">de herramientas aparece encima.</text>
  <rect x="140" y="185" width="470" height="110" rx="2" fill="#e8f1ec" stroke="#c3c4c7" stroke-dasharray="4 3"/>
  <polygon points="300,270 350,215 385,250 410,230 470,270" fill="#7fb59a"/>
  <circle cx="440" cy="215" r="12" fill="#e0b84a"/>
  <text x="375" y="290" text-anchor="middle" font-size="12" fill="#2a5542">Bloque Imagen</text>
  <rect x="140" y="310" width="225" height="70" rx="2" fill="#fff" stroke="#c3c4c7" stroke-dasharray="4 3"/>
  <rect x="385" y="310" width="225" height="70" rx="2" fill="#fff" stroke="#c3c4c7" stroke-dasharray="4 3"/>
  <text x="375" y="400" text-anchor="middle" font-size="12" fill="#50575e">Bloque Columnas con dos bloques dentro (anidados)</text>
  <rect x="685" y="60" width="265" height="370" fill="#fff" stroke="#c3c4c7"/>
  <text x="710" y="88" font-size="14" fill="#50575e">Entrada</text>
  <text x="790" y="88" font-size="14" font-weight="bold" fill="#1d2327">Bloque</text>
  <line x1="785" y1="96" x2="845" y2="96" stroke="#2271b1" stroke-width="3"/>
  <text x="705" y="125" font-size="14" font-weight="bold" fill="#1d2327">¶ Párrafo</text>
  <text x="705" y="160" font-size="13" fill="#1d2327">Color</text>
  <circle cx="715" cy="180" r="9" fill="#1d2327"/><circle cx="740" cy="180" r="9" fill="#2a5542"/><circle cx="765" cy="180" r="9" fill="#21759b"/>
  <text x="705" y="220" font-size="13" fill="#1d2327">Tipografía</text>
  <rect x="705" y="230" width="220" height="26" rx="3" fill="#fff" stroke="#8c8f94"/>
  <text x="715" y="248" font-size="12" fill="#50575e">Tamaño: Mediano</text>
  <text x="705" y="290" font-size="13" fill="#1d2327">Dimensiones</text>
  <rect x="705" y="300" width="220" height="26" rx="3" fill="#fff" stroke="#8c8f94"/>
  <text x="705" y="360" font-size="13" fill="#1d2327">Avanzado</text>
  <text x="705" y="380" font-size="12" fill="#50575e">Clase CSS adicional, ancla HTML</text>
  <g font-size="13" font-weight="bold" fill="#b3261e">
    <text x="62" y="455">① Insertador de bloques (+)</text>
    <text x="300" y="455">② Lienzo: el contenido, bloque a bloque</text>
    <text x="640" y="455">③ Panel de ajustes (Entrada / Bloque)</text>
  </g>
</svg>
