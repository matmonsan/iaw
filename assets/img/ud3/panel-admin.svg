<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Segoe UI, Arial, sans-serif">
  <title>Esquema del escritorio de administración de WordPress</title>
  <rect width="960" height="500" fill="#fff"/>
  <rect x="10" y="10" width="940" height="480" rx="10" fill="#f0f0f1" stroke="#c3c4c7" stroke-width="2"/>
  <rect x="10" y="10" width="940" height="34" rx="10" fill="#1d2327"/>
  <rect x="10" y="30" width="940" height="14" fill="#1d2327"/>
  <circle cx="32" cy="27" r="10" fill="none" stroke="#c3c4c7" stroke-width="2"/>
  <text x="28" y="32" font-size="12" font-weight="bold" fill="#c3c4c7">W</text>
  <text x="55" y="32" font-size="13" fill="#f0f0f1">Mi sitio  ·  0 comentarios  ·  + Añadir</text>
  <text x="935" y="32" text-anchor="end" font-size="13" fill="#f0f0f1">Hola, admin</text>
  <text x="600" y="32" text-anchor="middle" font-size="12" fill="#72aee6">① Barra de herramientas</text>
  <rect x="10" y="44" width="180" height="446" fill="#1d2327"/>
  <rect x="10" y="456" width="180" height="34" fill="#1d2327"/>
  <g font-size="14" fill="#f0f0f1">
    <rect x="10" y="56" width="180" height="30" fill="#2271b1"/>
    <text x="30" y="76">Escritorio</text>
    <text x="30" y="110">Entradas</text>
    <text x="30" y="138">Medios</text>
    <text x="30" y="166">Páginas</text>
    <text x="30" y="194">Comentarios</text>
    <line x1="22" y1="210" x2="178" y2="210" stroke="#3c434a"/>
    <text x="30" y="234">Apariencia</text>
    <text x="30" y="262">Plugins</text>
    <text x="30" y="290">Usuarios</text>
    <text x="30" y="318">Herramientas</text>
    <text x="30" y="346">Ajustes</text>
  </g>
  <text x="100" y="400" text-anchor="middle" font-size="12" fill="#72aee6">② Menú lateral</text>
  <text x="100" y="418" text-anchor="middle" font-size="11" fill="#a7aaad">(cambia según el rol)</text>
  <text x="215" y="80" font-size="22" fill="#1d2327">Escritorio</text>
  <g>
    <rect x="215" y="98" width="715" height="80" rx="4" fill="#fff" stroke="#c3c4c7"/>
    <text x="235" y="128" font-size="16" font-weight="bold" fill="#1d2327">¡Te damos la bienvenida a WordPress!</text>
    <text x="235" y="152" font-size="13" fill="#50575e">Personaliza tu sitio · Crea tu primera entrada · Gestiona los widgets</text>
  </g>
  <g>
    <rect x="215" y="192" width="350" height="130" rx="4" fill="#fff" stroke="#c3c4c7"/>
    <text x="230" y="216" font-size="14" font-weight="bold" fill="#1d2327">De un vistazo</text>
    <text x="230" y="244" font-size="13" fill="#2271b1">12 entradas   ·   5 páginas</text>
    <text x="230" y="268" font-size="13" fill="#2271b1">8 comentarios</text>
    <text x="230" y="292" font-size="12" fill="#50575e">WordPress con el tema Twenty Twenty-Five</text>
  </g>
  <g>
    <rect x="580" y="192" width="350" height="130" rx="4" fill="#fff" stroke="#c3c4c7"/>
    <text x="595" y="216" font-size="14" font-weight="bold" fill="#1d2327">Borrador rápido</text>
    <rect x="595" y="230" width="320" height="24" rx="3" fill="#fff" stroke="#8c8f94"/>
    <rect x="595" y="262" width="320" height="30" rx="3" fill="#fff" stroke="#8c8f94"/>
    <rect x="595" y="298" width="100" height="18" rx="3" fill="#2271b1"/>
    <text x="645" y="311" text-anchor="middle" font-size="11" fill="#fff">Guardar borrador</text>
  </g>
  <g>
    <rect x="215" y="336" width="350" height="110" rx="4" fill="#fff" stroke="#c3c4c7"/>
    <text x="230" y="360" font-size="14" font-weight="bold" fill="#1d2327">Salud del sitio</text>
    <circle cx="260" cy="405" r="22" fill="none" stroke="#dcdcde" stroke-width="7"/>
    <path d="M260,383 A22,22 0 1 1 238,405" fill="none" stroke="#00a32a" stroke-width="7"/>
    <text x="300" y="400" font-size="13" fill="#1d2327">Bien</text>
    <text x="300" y="420" font-size="12" fill="#50575e">2 elementos recomendados</text>
  </g>
  <g>
    <rect x="580" y="336" width="350" height="110" rx="4" fill="#fff" stroke="#c3c4c7"/>
    <text x="595" y="360" font-size="14" font-weight="bold" fill="#1d2327">Actividad</text>
    <text x="595" y="386" font-size="12" fill="#50575e">Publicado recientemente:</text>
    <text x="595" y="406" font-size="12" fill="#2271b1">Bienvenida al curso · Horario de tutorías</text>
    <text x="595" y="426" font-size="12" fill="#50575e">Comentarios pendientes: 1</text>
  </g>
  <text x="572" y="470" text-anchor="middle" font-size="12" fill="#2271b1">③ Área de trabajo con widgets del escritorio (se pueden mostrar u ocultar en «Opciones de pantalla»)</text>
</svg>
